name: Publish GHCR Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          submodules: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upstream commits
        id: upstream
        run: |
          echo "WING_SHA=$(git ls-remote https://github.com/daeuniverse/dae-wing.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "DAE_SHA=$(git ls-remote https://github.com/daeuniverse/dae.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # Go and eBPF are cross-compiled on the runner, so extra platforms are cheap.
          platforms: linux/386,linux/amd64,linux/arm64
          push: true
          pull: true
          build-args: |
            DAED_VERSION=${{ github.sha }}
            WING_BRANCH=main
            DAE_BRANCH=main
            WING_SHA=${{ steps.upstream.outputs.WING_SHA }}
            DAE_SHA=${{ steps.upstream.outputs.DAE_SHA }}
          cache-from: type=gha,scope=publish-ghcr
          cache-to: type=gha,mode=max,scope=publish-ghcr
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
